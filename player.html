var v = document.getElementById('v');
var statusEl = document.getElementById('status');
var listEl = document.getElementById('list');
var selEl = document.getElementById('country');
var qEl = document.getElementById('q');
var hls = null;

function setStatus(t){ statusEl.textContent = t || ''; }

function play(url, name){
  setStatus('Cargando: ' + name + ' ...');
  if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
  var nativeHls = !!(v.canPlayType('application/vnd.apple.mpegurl') || v.canPlayType('application/x-mpegURL'));

  function tryNative(){
    v.src = url;
    v.load();
    var p = v.play();
    if (p && p.catch) p.catch(function(){});
  }

  function tryHls(){
    if (window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls({ maxBufferLength: 20 });
      hls.loadSource(url);
      hls.attachMedia(v);
      hls.on(window.Hls.Events.MANIFEST_PARSED, function(){
        setStatus('Reproduciendo: ' + name);
        var p = v.play(); if (p && p.catch) p.catch(function(){});
      });
      hls.on(window.Hls.Events.ERROR, function(evt, data){
        if (data && data.fatal) {
          setStatus('Error en ' + name + ' (enlace caido o bloqueado). Proba otro canal.');
        }
      });
    } else {
      tryNative();
    }
  }

  if (nativeHls) {
    var failed = false;
    var onErr = function(){ if (!failed) { failed = true; tryHls(); } };
    v.addEventListener('error', onErr, {once:true});
    tryNative();
  } else {
    tryHls();
  }
}

v.addEventListener('playing', function(){ setStatus('Reproduciendo.'); });

function render(){
  var q = (qEl.value || '').toLowerCase();
  var c = selEl.value;
  listEl.innerHTML = '';
  var html = '';
  for (var i=0;i<CH.length;i++){
    var ch = CH[i];
    if (c && ch.g !== c) continue;
    if (q && ch.n.toLowerCase().indexOf(q) === -1) continue;
    html += '<div class="ch" data-i="' + i + '">' +
      (ch.l ? '<img src="' + ch.l + '" onerror="this.style.visibility=\'hidden\'">' : '') +
      '<span>' + ch.n.replace(/</g,'&lt;') + '</span></div>';
  }
  listEl.innerHTML = html || '<div class="hint">Sin resultados.</div>';
}

listEl.addEventListener('click', function(e){
  var t = e.target;
  while (t && t !== listEl && !t.getAttribute('data-i')) t = t.parentNode;
  if (!t || t === listEl) return;
  var i = parseInt(t.getAttribute('data-i'), 10);
  var nodes = listEl.getElementsByClassName('ch');
  for (var k=0;k<nodes.length;k++) nodes[k].className = 'ch';
  t.className = 'ch sel';
  play(CH[i].u, CH[i].n);
});

var countries = [];
for (var i=0;i<CH.length;i++) if (countries.indexOf(CH[i].g) === -1) countries.push(CH[i].g);
selEl.innerHTML = '<option value="">Todos los paises (' + countries.length + ')</option>' +
  countries.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');

qEl.addEventListener('input', render);
selEl.addEventListener('change', render);
setStatus(CH.length + ' canales disponibles. Eleji uno.');
render();
</script>
